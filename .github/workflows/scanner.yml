# NIFTY BSL/SSL Scanner — cloud runs (GitHub Actions)
#
# Scheduled: every 5 minutes, Mon–Fri, during NSE hours (09:15–15:30 IST =
# 03:45–10:00 UTC). Each run is a FRESH machine, so it:
#   1. restores the alert-dedupe state (data/sent_alerts.json) from cache,
#   2. scans the last LOOKBACK_MINUTES of closed 5m bars (engine warmed up
#      on full history, alerts only on the recent window),
#   3. sends BUY / SELL / 🧹 sweep alerts to BOTH Telegram bots,
#   4. saves the updated dedupe state back to the cache.
#
# Because every source-specific alert key is persisted in the cached state
# file, the Yahoo path can NEVER alert the same bar twice, no matter how many
# fresh runs replay it. A separate TradingView process may alert independently;
# its event is correlated through the shared ledger when the deployments share
# the same state file.
#
# Manual: Actions tab -> "NIFTY BSL/SSL Scanner" -> Run workflow.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   BOT1_TOKEN, BOT2_TOKEN, CHAT_ID, CHAT_ID_2 (optional, defaults to CHAT_ID)

name: NIFTY BSL/SSL Scanner

on:
  schedule:
    # every 5 min, 03:45–10:00 UTC (= 09:15–15:30 IST), Mon–Fri.
    # The run itself also gates on IST market hours (see below).
    - cron: "*/5 3-10 * * 1-5"
  workflow_dispatch: {}          # manual "Run workflow" button

permissions:
  contents: read

concurrency:
  group: nifty-scanner
  cancel-in-progress: false      # never kill a run mid-scan

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TZ: Asia/Kolkata
      SYMBOL: "^NSEI"
      DISPLAY_SYMBOL: "NSE:NIFTY"
      TIMEFRAMES: "5m"
      LOOKBACK_MINUTES: "20"
      MARKET_HOURS_ONLY: "false"    # the cron schedule encodes NSE hours
      TELEGRAM_ENABLED: "true"
      BOT1_TOKEN: ${{ secrets.BOT1_TOKEN }}
      BOT2_TOKEN: ${{ secrets.BOT2_TOKEN }}
      CHAT_ID: ${{ secrets.CHAT_ID }}
      CHAT_ID_2: ${{ secrets.CHAT_ID_2 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Gate on NSE market hours (scheduled runs)
        id: gate
        run: |
          python - <<'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo

          scheduled = os.environ.get("GITHUB_EVENT_NAME") == "schedule"
          now = datetime.now(ZoneInfo("Asia/Kolkata"))
          t = now.strftime("%H:%M")
          weekday = now.weekday() < 5          # Mon-Fri in IST

          if not scheduled:
              run = True
              print(f"Manual run ({t} IST) — scanning regardless of market hours.")
          elif weekday and "09:15" <= t < "15:30":
              run = True
              print(f"Inside NSE hours ({t} IST) — scanning.")
          else:
              run = False
              print(f"Outside NSE hours ({t} IST, weekday={weekday}) — skipping run.")

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"run={'true' if run else 'false'}\n")
          PY

      - name: Ensure dedupe state file exists
        if: steps.gate.outputs.run == 'true'
        run: mkdir -p data && touch data/sent_alerts.json

      # Restore-only: `actions/cache` would save under the *same* constant key,
      # and a later exact-key hit always wins over `restore-keys`, permanently
      # pinning every run to the FIRST cached state (dedupe would go stale and
      # alerts would be re-sent). The prefix restore below always picks the
      # newest `sent-alerts-*` entry saved by the step at the end of the job.
      - name: Restore alert state (dedupe cache)
        if: steps.gate.outputs.run == 'true'
        id: cache-state
        uses: actions/cache/restore@v4
        with:
          path: data/sent_alerts.json
          key: sent-alerts-${{ github.run_id }}
          restore-keys: |
            sent-alerts-

      - name: Trim old alert keys
        if: steps.gate.outputs.run == 'true'
        run: python scanner/prune_state.py --state data/sent_alerts.json --max-age-days 14

      - name: Scan (lookback)
        if: steps.gate.outputs.run == 'true'
        run: |
          echo "LOOKBACK_MINUTES=$LOOKBACK_MINUTES  TF=$TIMEFRAMES  symbol=$SYMBOL"
          python run_scanner.py --lookback "$LOOKBACK_MINUTES"

      - name: Save alert state (dedupe cache)
        if: always() && steps.gate.outputs.run == 'true'
        uses: actions/cache/save@v4
        with:
          path: data/sent_alerts.json
          key: sent-alerts-${{ github.run_id }}-${{ hashFiles('data/sent_alerts.json') }}
